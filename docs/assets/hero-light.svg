<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
<defs>
 <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#6D4AFF"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
 <radialGradient id="o1"><stop offset="0" stop-color="#6D4AFF" stop-opacity=".55"/><stop offset="1" stop-color="#6D4AFF" stop-opacity="0"/></radialGradient>
 <radialGradient id="o2"><stop offset="0" stop-color="#0891B2" stop-opacity=".45"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#E2E6EF" stroke-width="1"/></pattern>
 <clipPath id="r"><rect width="1200" height="380" rx="20"/></clipPath>
 <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
</defs>
<style>
 .o1{animation:d1 14s ease-in-out infinite alternate} .o2{animation:d2 18s ease-in-out infinite alternate}
 @keyframes d1{from{transform:translate(0,0)}to{transform:translate(260px,60px)}}
 @keyframes d2{from{transform:translate(0,0)}to{transform:translate(-300px,-40px)}}
 .up{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
 .u2{animation-delay:.25s} .u3{animation-delay:.5s} .u4{animation-delay:.8s}
 @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
 .cur{animation:blink 1.1s steps(1) infinite} @keyframes blink{50%{opacity:0}}
 .pulse{animation:pulse 2.4s ease-out infinite;transform-origin:925px 92px}
 @keyframes pulse{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
 .scan{animation:scan 4.5s ease-in-out infinite} @keyframes scan{0%{transform:translateX(-260px)}100%{transform:translateX(1400px)}}
</style>
<g clip-path="url(#r)">
 <rect width="1200" height="380" fill="#FFFFFF"/>
 <rect width="1200" height="380" fill="url(#grid)" opacity=".6"/>
 <circle class="o1" cx="260" cy="120" r="300" fill="url(#o1)"/>
 <circle class="o2" cx="980" cy="300" r="320" fill="url(#o2)"/>
 <rect y="180" width="1200" height="200" fill="url(#fade)"/>
 <rect class="scan" x="0" y="0" width="160" height="380" fill="url(#g)" opacity=".06"/>
 <g class="up" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><rect x="72" y="70" width="300" height="34" rx="17" fill="#FFFFFF" stroke="#E2E6EF"/>
  <circle cx="94" cy="87" r="5" fill="#059669"/><text x="108" y="92" font-size="14" fill="#5B6476">erc8004-agent-auth/1 · draft</text></g>
 <text class="up u2" x="70" y="178" font-size="64" font-weight="800" letter-spacing="-2" fill="#0D1220" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">Know which agent</text>
 <text class="up u2" x="70" y="250" font-size="64" font-weight="800" letter-spacing="-2" fill="url(#g)" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">is calling your API.</text>
 <text class="up u3" x="72" y="300" font-size="21" fill="#5B6476" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">Signed requests from ERC-8004 agents, verified against the on-chain Identity Registry.</text>
 <text class="up u3" x="72" y="330" font-size="21" fill="#5B6476" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">No API keys. No middleman. MIT licensed.</text>
 <g class="up u4">
  <circle class="pulse" cx="925" cy="92" r="16" fill="none" stroke="#059669" stroke-width="2"/>
  <rect x="900" y="70" width="228" height="44" rx="22" fill="#FFFFFF" stroke="#E2E6EF"/>
  <circle cx="1046" cy="92" r="0"/>
  <circle cx="925" cy="92" r="11" fill="#059669"/><path d="M919 92l4 4 8-8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="944" y="98" font-size="16" font-weight="600" fill="#0D1220" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif">eip155:8453:1203</text>
 </g>
 <rect x=".5" y=".5" width="1199" height="379" rx="20" fill="none" stroke="#E2E6EF"/>
</g></svg>